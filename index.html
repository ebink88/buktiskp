<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BSKP - Bukti SKP Harian</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d8b4d" />
  <meta name="description" content="Sistem Informasi Bukti Dukung SKP Harian" />

  <!-- Favicon (logo di tab browser) - v5: tanpa folder, tajam -->
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png?v=5" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=5" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=5" />
  <link rel="shortcut icon" href="favicon.ico?v=5" />

  <!-- iOS / Apple -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BSKP" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scroll ganda */
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycby1QJvBZ3HzBJ4auyWHnPDuaeDx4E_E5VPqSYZF6uyqmUNTIlz_HXOlZnPC0A1CO2LU/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>

  <!-- Registrasi Service Worker (agar bisa di-install sebagai PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('Service Worker gagal didaftarkan:', err);
        });
      });
    }
  </script>
</body>
</html>
